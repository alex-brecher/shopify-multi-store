name: CI

on:
  push:
  pull_request:
  # Weekly, so tests/api-versions.test.mjs fails before a pinned Admin API version loses support even without a push.
  schedule:
    - cron: "17 12 * * 1"

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        # Node 22 runs everything, including the workerd test (wrangler needs Node 22).
        # Node 20, the minimum for local installs, runs on Ubuntu; the workerd test skips there.
        node: [22]
        include:
          - os: ubuntu-latest
            node: 20
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
