# Temporary: removed before merge.
name: Probe Windows early 413
on:
  push:
    branches: [fix/windows-workerd-flake]
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      - run: node scripts/probe-early-413.mjs
        env:
          N: "60"
